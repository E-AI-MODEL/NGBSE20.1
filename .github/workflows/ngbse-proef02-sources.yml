name: NGBSE Proef 02 - freeze full published sources
on:
  push:
    branches:
      - research/second-output-ab-20261106
    paths:
      - research/second_output_ab/sources_frozen.json
      - research/second_output_ab/capture_sources.py
      - .github/workflows/ngbse-proef02-sources.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Freeze accessible published evidence cards (full-text XML timed out)
        run: |
          mkdir -p research-artifacts/ngbse-proef02
          cp research/second_output_ab/sources_frozen.json research-artifacts/ngbse-proef02/sources.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("research-artifacts/ngbse-proef02/sources.json").read_text())
          assert len(d["cases"])==3 and set(d["papers"])=={"B","K"}
          for p in d["papers"].values():
              ids=[r["id"] for r in p["paragraphs"]]
              assert len(ids)==len(set(ids)) and len(ids)>=18
              assert "not full text" in p["extraction_method"]
          print("SOURCE_FROZEN cards",sum(len(p["paragraphs"]) for p in d["papers"].values()))
          PY
      - name: Upload unchanged paper snapshot, no model calls
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ngbse-proef02-equal-sources
          path: research-artifacts/ngbse-proef02/sources.json
          if-no-files-found: warn
          retention-days: 14
