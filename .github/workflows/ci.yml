name: NGBSE 20.3 CI/CD Pipeline

on:
  push:
    branches: [ main, develop, '20.3*' ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  linkcheck:
    name: Link Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Check links (lychee)
        uses: lycheeverse/lychee-action@v1
        with:
          args: >
            --no-progress --max-redirects 5 --accept 200,206,302,403
            --config .lychee.toml
            **/*.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  lint-and-format:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install mypy

      - name: Run MyPy (type checking)
        env:
          PYTHONPATH: src
        run: mypy src/ --ignore-missing-imports || true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock || true
          pip install bandit safety pip-audit

      - name: Run Bandit (security linting)
        env:
          PYTHONPATH: src
        run: bandit -r src/ -f json -o bandit-report.json || true

      - name: Run Safety (dependency vulnerability check)
        run: safety check --json --output safety-report.json || true

      - name: Run pip-audit (dependency audit)
        run: pip-audit -r requirements.lock || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json

  config-validation:
    name: Config Schema Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install .

      - name: Validate sources.json schema
        env:
          PYTHONPATH: src
        run: |
          python -c "
          from ngbse20.config.loader import load_source_trust
          config = load_source_trust()
          print(f'Source trust config loaded: {len(config.domains)} domains')
          print(f'Default trust level: {config.default_trust_level}')
          "

      - name: Validate rules.json schema
        env:
          PYTHONPATH: src
        run: |
          python -c "
          from ngbse20.config.loader import load_rules
          rules = load_rules()
          print(f'Rules loaded: {len(rules)} rules')
          for rule in rules:
              print(f'Rule {rule[\"id\"]}: {rule[\"name\"]} (enabled: {rule.get(\"enabled\", True)})')
          "

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pytest pytest-cov pytest-mock
          pip install .

      - name: Verify pytest installation
        run: |
          which pytest
          pytest --version

      - name: Typecheck (mypy)
        env:
          PYTHONPATH: src
        run: mypy src || true

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: pytest -q -m "not slow and not integration" --maxfail=1 --cov=src/ngbse20 --cov-report=xml --cov-report=html

      - name: Run scoring v18.1 tests
        env:
          PYTHONPATH: src
        run: pytest tests/test_scoring_v18_1.py tests/test_source_trust_config.py -v

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install pytest pytest-mock

      - name: Print sys.path
        run: python -c "import sys; [print(p) for p in sys.path]"
      - name: Run integration tests
        env:
          PYTHONPATH: src
        run: pytest -vv -m "integration" tests/integration --maxfail=1

      - name: Run scoring integration tests
        env:
          PYTHONPATH: src
        run: pytest tests/integration/test_scoring_integration.py -v

  golden-tests:
    name: Golden Tests (Determinism)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install .

      - name: Run golden tests
        env:
          PYTHONPATH: src
        run: |
          python -c "
          from src.ngbse20.scoring.v18 import ScoringConfig, score_findings
          from src.ngbse20.config.loader import load_source_trust, load_rules
          
          # Test deterministic scoring
          findings = [
              {
                  'title': 'Test finding',
                  'url': 'https://github.com/user/repo',
                  'timestamp': '2024-01-01T00:00:00Z'
              }
          ]
          
          cfg = ScoringConfig(enable_source_trust=True, enable_keyword_score=True)
          source_trust = load_source_trust()
          rules = load_rules()
          
          # Run multiple times to ensure determinism
          result1 = score_findings(findings, cfg, source_trust.dict(), rules)
          result2 = score_findings(findings, cfg, source_trust.dict(), rules)
          
          assert result1[0]['score'] == result2[0]['score'], 'Scoring is not deterministic'
          print('Golden test passed: scoring is deterministic')
          "

  sbom-generation:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate Python SBOM
        run: |
          syft packages . -o cyclonedx-json > sbom-cyclonedx.json
          syft packages . -o spdx-json > sbom-spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-reports
          path: |
            sbom-cyclonedx.json
            sbom-spdx.json

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [config-validation, lint-and-format, unit-tests, integration-tests, golden-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t ngbse20:latest .
          docker build -t ngbse20:${{ github.sha }} .

      - name: Test Docker image
        run: |
          docker run --rm ngbse20:latest python -c "import ngbse20; print('Import successful')"

      - name: Save Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker save ngbse20:latest | gzip > ngbse20-latest.tar.gz

      - name: Upload Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: ngbse20-latest.tar.gz

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [lint-and-format, unit-tests, integration-tests, security-scan, docker-build]
    if: github.event_name == 'release'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom-reports

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Create Release Assets
        run: |
          mkdir -p release-assets
          cp sbom-cyclonedx.json release-assets/
          cp sbom-spdx.json release-assets/
          cp ngbse20-latest.tar.gz release-assets/
          
          # Create release notes
          echo "# NGBSE 20.2.0-GA Release" > release-assets/RELEASE_NOTES.md
          echo "" >> release-assets/RELEASE_NOTES.md
          echo "## Security" >> release-assets/RELEASE_NOTES.md
          echo "- SBOM included for supply chain security" >> release-assets/RELEASE_NOTES.md
          echo "- Dependency vulnerability scanning" >> release-assets/RELEASE_NOTES.md
          echo "" >> release-assets/RELEASE_NOTES.md
          echo "## Docker" >> release-assets/RELEASE_NOTES.md
          echo "- Pre-built Docker image available" >> release-assets/RELEASE_NOTES.md

      - name: Upload Release Assets
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./release-assets/
          asset_name: release-assets
          asset_content_type: application/zip