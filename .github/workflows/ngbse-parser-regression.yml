name: NGBSE numbered-question parser regression

on:
  push:
    branches:
      - "fix/ngbse-curiosity-parser-*"
    paths:
      - "src/ngbse20/ballm/curiosity_generator.py"
      - "tests/test_curiosity_numbered_model_questions.py"
      - "research/ngbse_quality/replay_parser.py"
      - ".github/workflows/ngbse-parser-regression.yml"
  pull_request:
    paths:
      - "src/ngbse20/ballm/curiosity_generator.py"
      - "tests/test_curiosity_numbered_model_questions.py"
      - "research/ngbse_quality/replay_parser.py"
      - ".github/workflows/ngbse-parser-regression.yml"

permissions:
  contents: read

jobs:
  parser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install pytest -e .
      - name: Run focused old NGBSE model question tests
        run: python -m pytest -q tests/test_curiosity_numbered_model_questions.py
      - name: Verify compile
        run: python -m py_compile src/ngbse20/ballm/curiosity_generator.py research/ngbse_quality/replay_parser.py
