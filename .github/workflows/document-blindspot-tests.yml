name: Test document blindspots

on:
  push:
    branches:
      - feature/document-blindspot-analysis-20261106
    paths:
      - .github/workflows/document-blindspot-tests.yml
      - src/ngbse20/research/**
      - src/ngbse20/cli.py
      - tests/test_document_blindspots.py
      - pyproject.toml
  pull_request:
    branches:
      - main
    paths:
      - src/ngbse20/research/**
      - src/ngbse20/cli.py
      - tests/test_document_blindspots.py
      - .github/workflows/document-blindspot-tests.yml

permissions:
  contents: read

jobs:
  document-offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install current NGBSE and test runner
        run: python -m pip install --disable-pip-version-check -e . "pytest>=8,<10"
      - name: Compile and test research route without API keys
        env:
          OPENAI_API_KEY: ''
          ANTHROPIC_API_KEY: ''
          AZURE_OPENAI_API_KEY: ''
          GOOGLE_API_KEY: ''
          COHERE_API_KEY: ''
        run: |
          python -m compileall -q src/ngbse20/research
          pytest -q tests/test_document_blindspots.py
          ngbse20 analyze-document --input examples/research_text_packet.json --out /tmp/ngbse-document-result.json
          python -c 'import json; v=json.load(open("/tmp/ngbse-document-result.json")); assert v["status"]=="complete" and v["claims"] and v["blindspots"]'
