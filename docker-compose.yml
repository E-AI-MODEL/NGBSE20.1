version: "3.9"
services:
  ngbse20:
    build: .
    image: ngbse20:latest
    env_file:
      - .env
    volumes:
      - ./data:/app/data:ro
      - ./out:/app/out
    environment:
      - SEEDS_PATH=${SEEDS_PATH:-data/seeds.jsonl}
      - RULES_PATH=${RULES_PATH:-data/rules.json}
      - OUT_DIR=${OUT_DIR:-out}
      - ALLOWLIST=${ALLOWLIST:-*}
    command: >
      run 
      --seeds ${SEEDS_PATH:-data/seeds.jsonl}
      --rules ${RULES_PATH:-data/rules.json}
      --outdir ${OUT_DIR:-out}
      --allowlist ${ALLOWLIST:-*}
