version: "3.9"
services:
  ngbse20:
    build: .
    image: ngbse20:latest
    env_file:
      - .env
    volumes:
      - ./data:/app/data:ro
      - ./out:/app/out
    command: >
      collect --seeds ${SEEDS_PATH:-data/seeds.jsonl}
      --out ${OUT_DIR:-out}
      --async --concurrency ${CONCURRENCY:-20}
