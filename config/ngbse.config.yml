# NGBSE 20.3 Configuration
# Main configuration file for the Next-Generation Business Security Engine

# Output directory for results
output_dir: "out"

# Domain allowlist (use ["*"] for all domains)
allowlist: ["*"]

# Collector configuration
collectors:
  enabled:
    - "http_web"
    - "shodan"
    - "censys"
    - "leakix"
    - "urlscan"
    - "github"
    - "news"
  
  # Optional: Custom rate limits per collector (requests per minute)
  rate_limits:
    shodan: 60
    censys: 300
    leakix: 600
    urlscan: 60
    github: 600
    news: 600

# Scoring configuration
scoring:
  default_weights:
    coverage: 0.3    # Breadth of coverage
    recency: 0.3     # Timeliness
    confidence: 0.4  # Reliability

# BALLM (Bayesian Analysis and LLM Meta-layer) configuration
ballm:
  enabled: true
  # LLM configuration - system automatically selects provider based on available API keys
  model: "gpt-4"     # Preferred model (will be mapped to available provider)
  
  # Optional: Provider-specific model preferences
  # These override the generic model preference if the provider is available
  provider_models:
    openai: "gpt-4o-mini"           # OpenAI models: gpt-4, gpt-3.5-turbo, gpt-4o-mini
    azure_openai: "gpt-4"           # Azure OpenAI models: gpt-4, gpt-3.5-turbo
    anthropic: "claude-3.5-sonnet"  # Anthropic models: claude-3.5-sonnet, claude-3-haiku
    cohere: "command"               # Cohere models: command, command-light
    google: "gemini-pro"            # Google models: gemini-pro, gemini-pro-vision

# Optional: Advanced settings
advanced:
  # Maximum findings per collector
  max_findings_per_collector: 100
  
  # Timeout settings (seconds)
  request_timeout: 30
  collection_timeout: 300
  
  # Logging level
  log_level: "INFO"