# NGBSE 20.3 Configuration File
# Next Generation Business Security Engine

# General Settings
output_dir: "output"
allowlist: ["*"]

# Pipeline Options
max_concurrent_collectors: 5
output_format: "json"
enable_ballm: true
enable_forecasting: true
enable_scenarios: true

# Export Configuration
export:
  formats: ["csv", "html", "docx"]
  output_dir: "output"
  csv_delimiter: ","
  csv_quote_char: '"'
  csv_encoding: "utf-8"
  html_theme: "default"
  html_title: "NGBSE 20.3 Security Analysis Report"
  html_template_path: null
  docx_template_path: null
  include_charts: true
  include_tables: true
  stix_version: "2.1"
  include_indicators: true
  include_observables: true
  include_relationships: true

# Collector Manager Configuration
collector_manager:
  enabled_collectors: []
  external_collectors: []
  auto_discovery: true
  plugin_directory: null
  collector_timeout: 300
  max_concurrent_collectors: 5

# Source Trust Configuration
source_trust:
  default_trust_level: 0.5
  domains: {}

# Collector Configurations
collectors:
  - name: "http_web"
    enabled: true
    api_key: null
    rate_limit: null
    timeout: 30
    max_retries: 3
    options: {}
  
  - name: "leakix"
    enabled: true
    api_key: null
    rate_limit: 60
    timeout: 30
    max_retries: 3
    options: {}
  
  - name: "shodan"
    enabled: true
    api_key: null
    rate_limit: 1
    timeout: 30
    max_retries: 3
    options: {}
  
  - name: "censys"
    enabled: true
    api_key: null
    rate_limit: 1
    timeout: 30
    max_retries: 3
    options: {}
  
  - name: "urlscan"
    enabled: true
    api_key: null
    rate_limit: 1
    timeout: 30
    max_retries: 3
    options: {}
  
  - name: "github"
    enabled: true
    api_key: null
    rate_limit: 60
    timeout: 30
    max_retries: 3
    options: {}
  
  - name: "news"
    enabled: true
    api_key: null
    rate_limit: 60
    timeout: 30
    max_retries: 3
    options: {}

# General Options
options:
  debug: "false"
  verbose: "false"
  log_level: "INFO"