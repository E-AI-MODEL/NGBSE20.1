[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ngbse20"
version = "20.3.0"
description = "Next-Gen Breach Scenario Engine 20.3 - GA Release"
license = {text = "Commercial"}
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "tldextract>=5.1",
  "aiohttp>=3.9",
  "click>=8.1",
  "pydantic>=2.8",
  "stix2>=3.0",
  "python-docx>=1.1.0",
  "PyYAML>=6.0.1",
  "python-dotenv>=1.0.0",
  "psutil>=5.9"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23.8",
  "mypy>=1.10",
  "pytest-cov>=5.0",
  "pip-audit>=2.7",
  "types-requests",
  "types-aiohttp",
  "types-beautifulsoup4",
  "types-docx",
]

[project.scripts]
ngbse20 = "ngbse20.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ngbse20*"]
exclude = ["tests*", "docs*", "data*"]


[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["build", "dist"]
plugins = []

[[tool.mypy.overrides]]
module = ["tldextract", "stix2", "docx", "docx.shared"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --maxfail=1"
testpaths = ["tests"]
markers = [
    "slow: mark a test as slow.",
    "integration: mark integration tests.",
    "unit: mark unit tests."
]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["ngbse20"]
