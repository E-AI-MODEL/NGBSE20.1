[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ngbse20"
version = "20.1.0"
description = "NGBSE 20.1 - Complete OSINT engine with forecasting and blindspot analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "PyYAML>=6.0.1",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.3",
    "tldextract>=5.1.2",
    "stix2>=3.0.1"
]

[project.scripts]
ngbse20 = "ngbse20.cli:main"
