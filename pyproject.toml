[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ngbse20"
version = "20.1.1"
description = "Next-Gen Breach Scenario Engine 20.1"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "tldextract>=5.1",
  "aiohttp>=3.9",
  "click>=8.1",
  "pydantic>=2.8",
  "stix2>=3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23.8",
  "ruff>=0.5.0",
  "mypy>=1.10",
  "pytest-cov>=5.0",
  "pip-audit>=2.7",
  "types-requests",
  "types-aiohttp",
  "types-beautifulsoup4",
  "types-docx",
]

[project.scripts]
ngbse20 = "ngbse20.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ngbse20*"]
exclude = ["tests*", "docs*", "data*"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src"]
exclude = ["build/", "dist/", ".venv/"]

[tool.ruff.lint]
select = ["E","F","I","UP","B","PL","RUF"]
ignore = ["E501"]
per-file-ignores = { "tests/**" = ["PLR2004", "PLC0415", "F401"] }

[tool.ruff.lint.isort]
known-first-party = ["ngbse20"]
combine-as-imports = true

[tool.mypy]
python_version = "3.11"
strict = true
plugins = []

[[tool.mypy.overrides]]
module = ["tldextract", "stix2", "docx", "docx.shared"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["ngbse20"]
