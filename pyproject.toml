[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ngbse20"
version = "20.2.1"
description = "Next-Gen Breach Scenario Engine 20.2 - GA Release"
license = {text = "Commercial"}
requires-python = ">=3.9.23"
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "tldextract>=5.1",
  "aiohttp>=3.9",
  "click>=8.1",
  "pydantic>=2.8",
  "stix2>=3.0",
  "python-docx>=1.1.0",
  "PyYAML>=6.0.1",
  "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23.8",
  "ruff>=0.5.0",
  "mypy>=1.10",
  "pytest-cov>=5.0",
  "pip-audit>=2.7",
  "types-requests",
  "types-aiohttp",
  "types-beautifulsoup4",
  "types-docx",
]

[project.scripts]
ngbse20 = "ngbse20.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ngbse20*"]
exclude = ["tests*", "docs*", "data*"]

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src"]
exclude = ["build/", "dist/", ".venv/"]

[tool.ruff.lint]
select = ["E","F","I","UP","B","PL","RUF","PLE","PT","BLE","C90","SIM"]
ignore = ["E501"]
per-file-ignores = { "tests/**" = ["PLR2004", "PLC0415", "F401", "S101"] }

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = []

[tool.ruff.lint.isort]
known-first-party = ["ngbse20"]
combine-as-imports = true
force-single-line = false
multi-line-output = 3

[tool.black]
line-length = 120
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.9"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["build", "dist"]
plugins = []

[[tool.mypy.overrides]]
module = ["tldextract", "stix2", "docx", "docx.shared"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --maxfail=1"
testpaths = ["tests"]
markers = [
    "slow: mark a test as slow.",
    "integration: mark integration tests.",
    "unit: mark unit tests."
]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["ngbse20"]
