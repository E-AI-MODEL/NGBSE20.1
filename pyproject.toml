[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ngbse20"
version = "20.1.1"
description = "Next-Gen Breach Scenario Engine 20.1"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "tldextract>=5.1.2",
  "aiohttp>=3.10.5",
  "aiodns>=3.2.0",
  "stix2>=3.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.2",
  "pytest-asyncio>=0.23.8",
]

[project.scripts]
ngbse20 = "ngbse20.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
