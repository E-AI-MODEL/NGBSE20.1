[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ngbse20"
version = "20.1.1"
description = "Next-Gen Breach Scenario Engine 20.1"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12.3",
  "tldextract>=5.1.2",
  "aiohttp>=3.10.5",
  "click>=8.1",
  "pydantic>=2.8",
  "aiodns>=3.2.0",
  "stix2>=3.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23.8",
  "ruff>=0.5.0",
  "mypy>=1.10",
  "pytest-cov>=5.0",
  "pip-audit>=2.7",
  "types-requests",
  "types-beautifulsoup4",
  "types-tldextract",
  "types-aiohttp",
]

[project.scripts]
ngbse20 = "ngbse20.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ngbse20*"]
exclude = ["tests*", "docs*", "data*"]

[tool.ruff]
line-length = 100
select = ["E","F","I","UP","B","SIM","PL","RUF"]
ignore = ["E203","E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
plugins = []

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["ngbse20"]
